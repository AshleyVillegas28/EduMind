<div class="ejecucion-container">
  <div class="progress-container">
    <div class="progress-bar" [style.width.%]="progresoBarra"></div>
    <span class="progress-text">Pregunta {{ indicePregunta + 1 }} de {{ testActual.preguntas.length }}</span>
  </div>

  <div class="pregunta-box" *ngIf="preg">
    <span class="categoria-tag">{{ preg.categoria }}</span>
    <h2>{{ preg.pregunta }}</h2>
    
    <div class="opciones-grid">
      <button 
        *ngFor="let opcion of opcionesDisponibles" 
        class="opcion-btn"
        [class.selected]="puntosPregunta === opcion.valor"
        (click)="marcar(opcion.valor)">
        {{ opcion.texto }}
      </button>
    </div>
  </div>

  <div class="actions">
    <button class="btn-nav secondary" (click)="irAnterior()" [disabled]="indicePregunta === 0">Anterior</button>
    <button class="btn-nav primary" (click)="irSiguiente()" [disabled]="puntosPregunta === null">
      {{ indicePregunta === testActual.preguntas.length - 1 ? 'Finalizar' : 'Siguiente' }}
    </button>
  </div>
</div>
