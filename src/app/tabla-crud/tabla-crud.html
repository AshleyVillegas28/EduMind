<section class="tabla-section">

  <!-- Encabezado de la página -->
  <div class="tabla-header">
    <h2 class="tabla-title">Módulos del Portal EduMind</h2>
  </div>

  <!-- Barra de búsqueda / filtro -->
  <div class="input-container">
    <label for="busqueda">Filtrar:</label>
    <input
      type="text"
      id="busqueda"
      name="busqueda"
      placeholder="Buscar por nombre, responsable u objetivo..."
      [(ngModel)]="filtroTexto"
    />
    <button class="btn-buscar" (click)="aplicarFiltro()">Buscar</button>
    <button class="btn-reiniciar" (click)="limpiarFiltro()">Reiniciar</button>
  </div>

  <!-- Tabla Angular Material -->
  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z4">

      <!-- Columna: N° Módulo -->
      <ng-container matColumnDef="NModulo">
        <th mat-header-cell *matHeaderCellDef class="celda-cabeza">N° Módulo</th>
        <td mat-cell *matCellDef="let element" class="celda-contenido celda-num">
          {{ element.NModulo }}
        </td>
      </ng-container>

      <!-- Columna: Nombre del módulo -->
      <ng-container matColumnDef="Nombre">
        <th mat-header-cell *matHeaderCellDef class="celda-cabeza">Nombre del Módulo</th>
        <td mat-cell *matCellDef="let element" class="celda-contenido celda-nombre">
          {{ element.Nombre }}
        </td>
      </ng-container>

      <!-- Columna: Responsable -->
      <ng-container matColumnDef="Responsable">
        <th mat-header-cell *matHeaderCellDef class="celda-cabeza">Responsable</th>
        <td mat-cell *matCellDef="let element" class="celda-contenido">
          {{ element.Responsable }}
        </td>
      </ng-container>

      <!-- Columna: Objetivo 1 -->
      <ng-container matColumnDef="Objetivo1">
        <th mat-header-cell *matHeaderCellDef class="celda-cabeza">Objetivo 1</th>
        <td mat-cell *matCellDef="let element" class="celda-contenido celda-objetivo">
          {{ element.Objetivo1 }}
        </td>
      </ng-container>

      <!-- Columna: Objetivo 2 -->
      <ng-container matColumnDef="Objetivo2">
        <th mat-header-cell *matHeaderCellDef class="celda-cabeza">Objetivo 2</th>
        <td mat-cell *matCellDef="let element" class="celda-contenido celda-objetivo">
          {{ element.Objetivo2 }}
        </td>
      </ng-container>

      <!-- Columna: Acciones (editar / eliminar) -->
      <ng-container matColumnDef="Acciones">
        <th mat-header-cell *matHeaderCellDef class="celda-cabeza celda-cabeza-acciones">Acciones</th>
        <td mat-cell *matCellDef="let element" class="celda-acciones">
          <div class="acciones-wrapper">
            <button class="btn-accion btn-editar" (click)="editarModulo(element)">✏️ Editar</button>
            <button class="btn-accion btn-eliminar" (click)="eliminarModulo(element)">🗑️ Eliminar</button>
          </div>
        </td>
      </ng-container>

      <!-- Filas de cabecera y datos -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- Mensaje cuando no hay resultados -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-msg" [attr.colspan]="displayedColumns.length">
          No se encontraron resultados para "<strong>{{ filtroTexto }}</strong>".
        </td>
      </tr>
    </table>
  </div>

</section>
